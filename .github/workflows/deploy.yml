# Production deploy runs on version tags (v1.0.0, v1.0.1, ...), not on merges to main.
# Same flow as pibbkids: the build happens here and the Vercel CLI uploads the prebuilt output.
#
# Required repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: Deploy

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --global vercel@latest

      # Pulls the production env vars (CONTACT_WEBHOOK_URL, CONTACT_WEBHOOK_SECRET) from the
      # Vercel project. They are read at runtime by the deployed function, not at build time.
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
